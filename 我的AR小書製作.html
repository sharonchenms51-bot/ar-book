<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #startButton {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 20px 40px; font-size: 20px; background: #ff8c00; color: white;
        border: none; border-radius: 30px; z-index: 999;
      }
    </style>
  </head>
  <body>
    <button id="startButton">點擊開始AR體驗</button>
    
    <a-scene mindar-image="imageTargetSrc:./targets.mind; autoStart: false;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets><a-asset-item id="model" src="./model.glb"></a-asset-item></a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="0 0 0" position="0 0 0.1" scale="0.3 0.3 0.3" src="#model" animation-mixer>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.querySelector("#startButton");
      const sceneEl = document.querySelector("a-scene");
      startButton.addEventListener("click", () => {
        startButton.style.display = "none";
        sceneEl.systems["mindar-image-system"].start();
      });
    </script>
  </body>
</html>
